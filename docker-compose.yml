services:
    app:
        build:
            context: .
            dockerfile: Dockerfile

        container_name: laravel-app

        ports:
            - "8000:8000"

        volumes:
            - .:/var/www

        depends_on:
            - mysql

    mysql:
        image: mysql:8.0

        container_name: laravel-mysql

        restart: unless-stopped

        environment:
            MYSQL_DATABASE: laravel
            MYSQL_ROOT_PASSWORD: root
            MYSQL_PASSWORD: password
            MYSQL_USER: laravel

        ports:
            - "3306:3306"

        volumes:
            - mysql_data:/var/lib/mysql

volumes:
    mysql_data:
